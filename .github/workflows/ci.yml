name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs postinstall → prisma generate, which needs a DATABASE_URL
      # to be present but never connects. A dummy value keeps CI off the real
      # database: nothing here should ever touch production data.
      - run: npm ci
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
